name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/ios-unsigned.yml

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iphoneos app
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Verify Xcode version
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          major="${version%%.*}"
          remainder="${version#*.}"
          minor="${remainder%%.*}"
          if (( major < 26 || (major == 26 && minor < 4) )); then
            echo "::error::Expo SDK 57 requires Xcode 26.4 or newer; found ${version}."
            exit 1
          fi

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Detect Xcode workspace and scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          project="$(find ios -maxdepth 1 -type d -name '*.xcodeproj' -print -quit)"
          if [[ -z "$workspace" || -z "$project" ]]; then
            echo "::error::Expo prebuild did not generate an Xcode workspace and project."
            exit 1
          fi
          scheme="$(xcodebuild -project "$project" -list -json | ruby -rjson -e 'puts JSON.parse(STDIN.read).dig("project", "schemes")&.first')"
          if [[ -z "$scheme" ]]; then
            echo "::error::Could not detect the application scheme."
            exit 1
          fi
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Using workspace $workspace and scheme $scheme"

      - name: Build unsigned device app
        shell: bash
        env:
          WORKSPACE: ${{ steps.xcode.outputs.workspace }}
          SCHEME: ${{ steps.xcode.outputs.scheme }}
          DERIVED_DATA: ${{ runner.temp }}/xuanim-derived-data
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            build

      - name: Package unsigned IPA
        shell: bash
        env:
          DERIVED_DATA: ${{ runner.temp }}/xuanim-derived-data
        run: |
          set -euo pipefail
          products="$DERIVED_DATA/Build/Products/Release-iphoneos"
          app_path="$(find "$products" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::The Release iphoneos app was not found."
            exit 1
          fi

          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")"
          if ! lipo -archs "$app_path/$executable" | tr ' ' '\n' | grep -qx arm64; then
            echo "::error::The app executable does not contain the arm64 device architecture."
            exit 1
          fi

          staging="$(mktemp -d)"
          mkdir -p "$staging/Payload"
          ditto "$app_path" "$staging/Payload/$(basename "$app_path")"
          (
            cd "$staging"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/xuanim-ios-unsigned.ipa" Payload
          )
          ls -lh "$GITHUB_WORKSPACE/xuanim-ios-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: xuanim-ios-unsigned
          path: xuanim-ios-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
